services:
  # 1. FRONTEND (React + Vite + Nginx)
  frontend:
    build: ./frontend
    container_name: ta-frontend
    restart: always
    expose:
      - "80"
    networks:
      - masjid_net

  # 2. BACKEND (FastAPI + Python)
  backend:
    build: ./backend
    container_name: ta-backend
    restart: always
    expose:
      - "8000"
    env_file:
      - ./backend/.env.production
    environment:
      ENV: production
      DEBUG: "false"
      DATABASE_URL: "mysql+pymysql://salman:Masjidnuruttaqwa1%40@db:3306/db_absensi"
      FIREBASE_CREDENTIALS_PATH: "/app/masjidnurutaqwa-2408d-firebase-adminsdk-fbsvc-b13b4158dd.json"
    command: >
      sh -c "
      echo 'Starting backend in PRODUCTION mode...'
      && uvicorn main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      - ./backend/static/uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - masjid_net

  # 3. DATABASE MySQL
  db:
    image: mysql:8.0
    container_name: ta-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'Masjidnuruttaqwa1@'
      MYSQL_DATABASE: db_absensi
      MYSQL_USER: salman
      MYSQL_PASSWORD: 'Masjidnuruttaqwa1@'
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - masjid_net

  # 4. CADDY
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - masjid_net

volumes:
  caddy_data:
  caddy_config:
  db_data:

networks:
  masjid_net:
    driver: bridge